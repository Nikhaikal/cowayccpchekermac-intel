name: Build macOS installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    name: Mac ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15
            script: dist:mac-intel -- --publish never
          - arch: arm64
            runner: macos-15-arm64 -- --publish never
            script: dist:mac
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and matching Chromium
        run: npm ci
      - name: Build installer
        run: npm run ${{ matrix.script }}
      - name: Upload installer files
        uses: actions/upload-artifact@v4
        with:
          name: Coway-IC-Checker-mac-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14
